version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotter_freight_api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mlflow-ui:
    image: python:3.11-slim
    container_name: spotter_mlflow_ui
    volumes:
      - ./mlruns:/app/mlruns
    working_dir: /app
    command: sh -c "pip install mlflow && mlflow ui --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    restart: always
